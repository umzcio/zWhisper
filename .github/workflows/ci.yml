name: CI

on:
  push:
    paths:
      - "zwhisper-mac/**"
  pull_request:
    paths:
      - "zwhisper-mac/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: zwhisper-mac
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project zWhisper.xcodeproj \
            -scheme zWhisper \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify || xcodebuild test \
            -project zWhisper.xcodeproj \
            -scheme zWhisper \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
