<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <g stroke="#636366" stroke-width="3" stroke-linecap="round">
    <!-- microphone capsule -->
    <rect x="176" y="56" width="48" height="88" rx="24"/>
    <!-- mic cradle arc -->
    <path d="M156 116 v12 a44 44 0 0 0 88 0 v-12"/>
    <!-- stem + base -->
    <path d="M200 172 v28"/>
    <path d="M172 204 h56"/>
  </g>
  <!-- dotted sound waves fading out, left -->
  <g fill="#636366">
    <circle cx="146" cy="122" r="4.5" opacity="0.8"/>
    <circle cx="124" cy="122" r="4" opacity="0.6"/>
    <circle cx="104" cy="122" r="3.5" opacity="0.45"/>
    <circle cx="86" cy="122" r="3" opacity="0.3"/>
    <circle cx="70" cy="122" r="2.5" opacity="0.18"/>
    <circle cx="56" cy="122" r="2" opacity="0.08"/>
    <!-- dotted sound waves fading out, right -->
    <circle cx="254" cy="122" r="4.5" opacity="0.8"/>
    <circle cx="276" cy="122" r="4" opacity="0.6"/>
    <circle cx="296" cy="122" r="3.5" opacity="0.45"/>
    <circle cx="314" cy="122" r="3" opacity="0.3"/>
    <circle cx="330" cy="122" r="2.5" opacity="0.18"/>
    <circle cx="344" cy="122" r="2" opacity="0.08"/>
  </g>
  <!-- faint dotted arcs around mic -->
  <g stroke="#636366" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 14">
    <path d="M138 100 a72 72 0 0 1 0 52" opacity="0.35"/>
    <path d="M262 100 a72 72 0 0 0 0 52" opacity="0.35"/>
  </g>
</svg>
